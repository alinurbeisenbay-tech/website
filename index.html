<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unect Talks — регистрация</title>
  <meta name="description" content="Unect Talks — вечер идей с 7 спикерами в Дохе. 16 октября, Georgetown University." />
  <meta property="og:title" content="Unect Talks" />
  <meta property="og:description" content="7 спикеров. 16 октября, 18:00. Georgetown University, Доха." />
  <meta property="og:image" content="assets/hero-doha.jpg" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <nav class="nav">
      <a href="#" class="brand" aria-label="Unect Talks">
        <img src="assets/logos/unect-white.png" alt="unect." width="629" height="142" />
      </a>
      <div class="nav-right">
        <div class="lang-switch" role="group" aria-label="Язык / Тіл">
          <button type="button" data-lang="ru">РУС</button>
          <button type="button" data-lang="kz">ҚАЗ</button>
        </div>
        <a href="#register" class="btn btn-light btn-small" data-i18n="navRegister">Регистрация</a>
      </div>
    </nav>

    <div class="hero-content">
      <p class="eyebrow" data-i18n="heroEyebrow"></p>
      <h1 data-i18n="heroTitle">Unect Talks</h1>
      <p class="tagline" data-i18n="heroTagline"></p>

      <ul class="meta">
        <li><span class="meta-label" data-i18n="dateLabel"></span><span data-i18n="dateValue"></span></li>
        <li><span class="meta-label" data-i18n="timeLabel"></span><span data-i18n="timeValue"></span></li>
        <li><span class="meta-label" data-i18n="venueLabel"></span><span data-i18n="venueValue"></span></li>
      </ul>

      <div class="countdown" id="countdown" >
        <p class="countdown-title" data-i18n="countdownTitle"></p>
        <div class="countdown-row">
          <div class="cd-unit"><strong id="cd-days">--</strong><span data-i18n="cdDays"></span></div>
          <span class="cd-sep" aria-hidden="true">:</span>
          <div class="cd-unit"><strong id="cd-hours">--</strong><span data-i18n="cdHours"></span></div>
          <span class="cd-sep" aria-hidden="true">:</span>
          <div class="cd-unit"><strong id="cd-minutes">--</strong><span data-i18n="cdMinutes"></span></div>
          <span class="cd-sep" aria-hidden="true">:</span>
          <div class="cd-unit"><strong id="cd-seconds">--</strong><span data-i18n="cdSeconds"></span></div>
        </div>
      </div>
      <p class="countdown-done" id="countdown-done" hidden data-i18n="countdownDone"></p>

      <a href="#register" class="btn btn-light" data-i18n="heroButton"></a>
    </div>

    <a href="#about" class="scroll-hint" aria-label="↓">&#8595;</a>
  </header>

  <main>
    <!-- ============ ABOUT ============ -->
    <section id="about" class="section about">
      <div class="container">
        <div class="split">
          <h2 data-i18n="aboutTitle"></h2>
          <div>
            <p class="lead" data-i18n="aboutText"></p>
            <div class="stats">
              <div><strong>7</strong><span data-i18n="statSpeakers"></span></div>
              <div><strong>1</strong><span data-i18n="statEvening"></span></div>
              <div><strong>&infin;</strong><span data-i18n="statConnections"></span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ SPEAKERS ============ -->
    <section id="speakers" class="section speakers">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="speakersTitle"></h2>
          <p data-i18n="speakersSubtitle"></p>
        </div>
        <div class="speaker-grid" id="speaker-grid"><!-- filled by script.js --></div>
      </div>
    </section>

    <!-- ============ REGISTER ============ -->
    <section id="register" class="section register">
      <div class="container register-inner">
        <div class="register-copy">
          <h2 data-i18n="registerTitle"></h2>
          <p data-i18n="registerText"></p>
          <p class="free" data-i18n="registerFree"></p>
        </div>

        <form id="register-form" class="form" novalidate>
          <div class="field">
            <label for="name" data-i18n="nameLabel"></label>
            <input id="name" name="name" type="text" autocomplete="name" data-i18n-placeholder="namePlaceholder" required />
            <small class="error" data-for="name"></small>
          </div>

          <div class="field">
            <label for="phone" data-i18n="phoneLabel"></label>
            <div class="phone-row">
              <select id="country" name="country" aria-label="Country code">
                <option value="+974" selected>🇶🇦 +974</option>
                <option value="+7">🇰🇿 +7</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+965">🇰🇼 +965</option>
                <option value="+973">🇧🇭 +973</option>
                <option value="+968">🇴🇲 +968</option>
                <option value="+90">🇹🇷 +90</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+91">🇮🇳 +91</option>
                <option value="other" data-i18n="countryOther"></option>
              </select>
              <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="5555 1234" required />
            </div>
            <small class="error" data-for="phone"></small>
          </div>

          <label class="consent">
            <input type="checkbox" name="consent" id="consent" checked />
            <span data-i18n="consent"></span>
          </label>

          <!-- honeypot: hidden from humans, catches bots -->
          <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" />

          <button type="submit" class="btn btn-dark btn-block" data-i18n="submit"></button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <div class="success" id="success" hidden>
          <div class="check">&#10003;</div>
          <h3 data-i18n="successTitle"></h3>
          <p data-i18n="successText"></p>
        </div>
      </div>
    </section>

    <!-- ============ ORGANIZERS ============ -->
    <section id="organizers" class="section organizers">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="organizersTitle"></h2>
          <p data-i18n="organizersSubtitle"></p>
        </div>

        <div class="org-grid">
          <a class="org" href="https://www.instagram.com/unect.doha/" target="_blank" rel="noopener">
            <div class="org-logo">
              <img src="assets/logos/unect-black.png" alt="unect." width="629" height="142" />
            </div>
            <img class="qr" src="assets/logos/qr-unect-black.png" alt="Instagram QR @unect.doha" width="520" height="597" loading="lazy" />
            <span class="handle">@unect.doha &nearr;</span>
          </a>

          <a class="org" href="https://www.instagram.com/qazaqhouse.doha/" target="_blank" rel="noopener">
            <div class="org-logo">
              <img src="assets/logos/qazaq-house-color.png" alt="Qazaq House" width="800" height="370" class="qh" />
            </div>
            <img class="qr" src="assets/logos/qr-qazaq-house-black.png" alt="Instagram QR @qazaqhouse.doha" width="520" height="597" loading="lazy" />
            <span class="handle">@qazaqhouse.doha &nearr;</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logos">
        <img src="assets/logos/unect-white.png" alt="unect." class="f-unect" />
        <span class="x">&times;</span>
        <img src="assets/logos/qazaq-house-white.png" alt="Qazaq House" class="f-qh" />
      </div>
      <span class="copy">&copy; <span id="year"></span> Unect Talks</span>
    </div>
  </footer>

  <script src="texts.js"></script>
  <script src="script.js"></script>
</body>
</html>
